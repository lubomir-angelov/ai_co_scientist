# OCR service: DeepSeek-OCR over FastAPI (GPU).
# Standalone: make -C services/ocr up
name: ai-co-ocr

# One build definition; `ocr` and `ocr-documents` run the same image.
x-ocr-build: &ocr-build
  context: ../..
  dockerfile: services/ocr/Dockerfile
  args:
    BASE_IMAGE: nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04
    SERVICES_DIR: services
    SERVICE_NAME: ocr

services:
  ocr:
    build: *ocr-build
    image: ai-co-scientist/ocr:local
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      HF_HOME: /workspace/hf-cache
      TRANSFORMERS_ATTENTION_IMPLEMENTATION: eager
      TRANSFORMERS_NO_FLASH_ATTENTION: "1"
      OCR_DOCUMENTS_DIR: /workspace/documents
    volumes:
      - ocr-documents:/workspace/documents
    ports:
      - "8002:8002"
    gpus:
      - device: 0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s

  # GPU-free reader of the document volume: the ONLY server of GET /ocr/documents/{doc_id}.
  # Stays up while the GPU is tenanted by the LLM (paper ingest phase 2, voice prepare).
  ocr-documents:
    build: *ocr-build
    image: ai-co-scientist/ocr:local
    restart: unless-stopped
    command: ["uvicorn", "src.document_server:app", "--host", "0.0.0.0", "--port", "8008", "--no-access-log"]
    environment:
      OCR_DOCUMENTS_DIR: /workspace/documents
    volumes:
      - ocr-documents:/workspace/documents:ro
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8008/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  # Every finished OCRResponse, written by `ocr`, served read-only by `ocr-documents`.
  ocr-documents:

networks:
  default:
    # Shared by every service compose file, so standalone services reach each other by name.
    name: ai-co-scientist-network
