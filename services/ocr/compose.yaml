# OCR service: DeepSeek-OCR over FastAPI (GPU).
# Standalone: make -C services/ocr up
name: ai-co-ocr

services:
  ocr:
    build:
      context: ../..
      dockerfile: services/ocr/Dockerfile
      args:
        BASE_IMAGE: nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04
        SERVICES_DIR: services
        SERVICE_NAME: ocr
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      HF_HOME: /workspace/hf-cache
      TRANSFORMERS_ATTENTION_IMPLEMENTATION: eager
      TRANSFORMERS_NO_FLASH_ATTENTION: "1"
      OCR_PAGE_CONCURRENCY: ${OCR_PAGE_CONCURRENCY:-1}
    ports:
      - "8002:8002"
    gpus:
      - device: 0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s

networks:
  default:
    # Shared by every service compose file, so standalone services reach each other by name.
    name: ai-co-scientist-network
