# LLM service: llama.cpp server + API-key gateway.
# Standalone:  make -C services/llm up      (thinking on by default)
# Full stack:  make up  (from repo root)    (thinking off, see compose.stack.yaml)
name: ai-co-llm

services:
  llm:
    #image: docker.io/gtonkov/llamacpp-turboquant:latest
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b10830
    restart: unless-stopped

    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"

      # Main model
      - --model
      - /models/Qwen3.8-27B-UD-Q4_K_XL/Qwen3.8-27B-UD-Q4_K_XL.gguf
      # Model id reported by /v1/models and expected in requests (memory uses it too)
      - --alias
      - Qwen3.8-27B-UD-Q4_K_XL

      # MTP sidecar
      #- --model-draft
      #- /models/Qwen3.8-27B-UD-Q4_K_XL/mtp-Qwen3.8-27B-Q4_0.gguf

      # Vision projector
      #- --mmproj
      #- /models/Qwen3.8-27B-UD-Q4_K_XL/mmproj-F16.gguf

      # Runtime settings
      - --n-gpu-layers
      - "-1"

      # Replaces both --mlock and --no-mmap
      - --load-mode
      - mlock

      # MTP type is detected automatically from --model-draft
      - --spec-draft-n-max
      - "3"

      # Qwen thinking is controlled by LLAMA_ARG_REASONING (env below) so it can be
      # switched without editing this file: LLM_REASONING=on|off|auto.
      # Note: 'auto' (llama.cpp default) follows the Qwen template, i.e. thinking ON.
      # A CLI flag would override the env var, so keep this commented out.
      #- --reasoning
      #- "on"

      # Use this for 256k context
      - --ctx-size
      - "262144"

      - --batch-size
      - "2048"
      - --ubatch-size
      - "512"

      - -np
      - "4"
      # Shared KV pool: any single request may use the full context (Graphiti prompts reach 45k+ tokens)
      - --kv-unified

      - --cache-reuse
      - "256"
      - --cache-ram
      - "4096"

      - --cache-type-k
      - q8_0
        #- turbo4
      - --cache-type-v
      - q8_0
        #- turbo4

      - --flash-attn
      - "on"

      - --jinja

      - --temp
        #- "0.6"
      - "1.0"
      - --top-p
      - "0.95"
      - --top-k
      - "20"
      - --min-p
      - "0.0"
      - --repeat-penalty
      - "1.0"
      - --presence-penalty
      - "0.0"

    volumes:
      - ../../models/hotswap:/models:ro

    environment:
      LLAMA_LOG_LEVEL: info
      LLAMA_ARG_REASONING: ${LLM_REASONING:-on}

    ports:
      - "8000:8080"

    gpus: all

    cap_add:
      - IPC_LOCK

    ulimits:
      memlock:
        soft: -1
        hard: -1

    mem_limit: 64g

    healthcheck:
      test:
        - CMD
        - bash
        - -lc
        - curl -sf http://localhost:8080/v1/models > /dev/null
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 60s

  llm-gateway:
    build: ./src/gateway
    environment:
      UPSTREAM_BASE_URL: http://llm:8080/v1
      API_KEY: ${LLM_API_KEY:-local-llm}
    ports:
      - "9000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      llm:
        condition: service_healthy

networks:
  default:
    # Shared by every service compose file, so standalone services reach each other by name.
    name: ai-co-scientist-network
