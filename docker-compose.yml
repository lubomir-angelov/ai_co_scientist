# Full AI co-scientist stack. Each service owns its compose file under services/<svc>/;
# this file only composes them. Run a single service with: make -C services/<svc> up
#
#   make up                        -> llm, ocr, ocr-documents, ocr-mcp, memory, voice (thinking off)
#   LLM_REASONING=on make up       -> same, with Qwen thinking on
#   docker compose --profile agent up -d orchestrator
name: ai-co-scientist

include:
  - path:
      - services/llm/compose.yaml
      - services/llm/compose.stack.yaml
  - services/ocr/compose.yaml
  - services/ocr_mcp/compose.yaml
  - services/memory/compose.yaml
  - services/octo_agent/compose.yaml
  - services/voice/compose.yaml

networks:
  default:
    name: ai-co-scientist-network
